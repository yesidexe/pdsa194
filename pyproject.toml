[project]
name = "evoting-platform"
version = "0.1.0"
description = "Prototipo local de votación electrónica con FastAPI, SQLite y patrones GoF."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
show_missing = true
skip_empty = true
